<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #070913;
      --accent-1: #6366f1;
      --accent-2: #ec4899;
      --accent-3: #06b6d4;
      --card-bg: rgba(17, 22, 42, 0.58);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --chip-bg: rgba(255, 255, 255, 0.06);
      --shadow-glow: 0 30px 80px -20px rgba(99, 102, 241, 0.35);
    }

    [data-theme="sunset"] {
      --bg-base: #12080d;
      --accent-1: #f97316;
      --accent-2: #ef4444;
      --accent-3: #eab308;
      --card-bg: rgba(34, 15, 22, 0.6);
      --shadow-glow: 0 30px 80px -20px rgba(249, 115, 22, 0.35);
    }

    [data-theme="emerald"] {
      --bg-base: #04110e;
      --accent-1: #10b981;
      --accent-2: #14b8a6;
      --accent-3: #3b82f6;
      --card-bg: rgba(10, 30, 26, 0.6);
      --shadow-glow: 0 30px 80px -20px rgba(16, 185, 129, 0.35);
    }

    [data-theme="daylight"] {
      --bg-base: #f4f7ff;
      --accent-1: #4f46e5;
      --accent-2: #db2777;
      --accent-3: #0284c7;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-muted: #475569;
      --chip-bg: rgba(15, 23, 42, 0.05);
      --shadow-glow: 0 30px 80px -20px rgba(79, 70, 229, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.6s cubic-bezier(0.22, 1, 0.36, 1), color 0.4s ease;
      padding: 1.5rem;
    }

    /* Ambient animated aurora blobs */
    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      filter: blur(90px);
      opacity: 0.65;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      animation: float 16s ease-in-out infinite alternate;
      transition: background 0.6s ease;
    }

    .blob-1 {
      width: 48vw;
      height: 48vw;
      max-width: 620px;
      max-height: 620px;
      background: radial-gradient(circle, var(--accent-1), transparent 70%);
      top: -12%;
      left: -8%;
    }

    .blob-2 {
      width: 44vw;
      height: 44vw;
      max-width: 560px;
      max-height: 560px;
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      bottom: -14%;
      right: -8%;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 36vw;
      height: 36vw;
      max-width: 460px;
      max-height: 460px;
      background: radial-gradient(circle, var(--accent-3), transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -11s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(40px, -30px) scale(1.08);
      }
      100% {
        transform: translate(-30px, 35px) scale(0.95);
      }
    }

    /* Interactive particle canvas */
    #constellation {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Subtle noise grain overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
    }

    /* Main glassmorphic card */
    .stage {
      perspective: 1200px;
      z-index: 2;
      width: 100%;
      max-width: 660px;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3.25rem 3rem;
      box-shadow: var(--shadow-glow);
      transform-style: preserve-3d;
      transition: transform 0.18s ease-out, background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
      overflow: hidden;
    }

    /* Dynamic spotlight inside card */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        520px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.11),
        transparent 45%
      );
      pointer-events: none;
      border-radius: inherit;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.25rem;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-3);
      box-shadow: 0 0 12px var(--accent-3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    .theme-switcher {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem;
      border-radius: 999px;
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
    }

    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .theme-dot:hover {
      transform: scale(1.18);
    }

    .theme-dot.active {
      border-color: var(--text-main);
      transform: scale(1.12);
    }

    .theme-dot[data-set="aurora"] { background: linear-gradient(135deg, #6366f1, #ec4899); }
    .theme-dot[data-set="sunset"] { background: linear-gradient(135deg, #f97316, #eab308); }
    .theme-dot[data-set="emerald"] { background: linear-gradient(135deg, #10b981, #3b82f6); }
    .theme-dot[data-set="daylight"] { background: linear-gradient(135deg, #e0e7ff, #fbcfe8); }

    .lang-tag {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: var(--accent-3);
      margin-bottom: 0.65rem;
      display: block;
      transition: opacity 0.25s ease;
    }

    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: clamp(2.75rem, 7vw, 4.5rem);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.03em;
      margin-bottom: 1.15rem;
      background: linear-gradient(120deg, var(--text-main) 15%, var(--accent-1) 52%, var(--accent-2) 88%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .fade-swap {
      opacity: 0;
      transform: translateY(8px);
    }

    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }

    .subtitle {
      font-size: 1.06rem;
      line-height: 1.65;
      color: var(--text-muted);
      max-width: 52ch;
      margin-bottom: 2.25rem;
    }

    .code-snippet {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: rgba(2, 6, 23, 0.42);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      margin-bottom: 2rem;
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 0.88rem;
      color: #e2e8f0;
      overflow-x: auto;
    }

    [data-theme="daylight"] .code-snippet {
      background: rgba(15, 23, 42, 0.88);
    }

    .code-kw { color: #c084fc; }
    .code-fn { color: #38bdf8; }
    .code-str { color: #86efac; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 600;
      padding: 0.82rem 1.4rem;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      transition: transform 0.18s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #ffffff;
      box-shadow: 0 10px 26px -6px rgba(99, 102, 241, 0.55);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -6px rgba(236, 72, 153, 0.55);
    }

    .btn-secondary {
      background: var(--chip-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.12);
    }

    .footer-meta {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (max-width: 540px) {
      .card {
        padding: 2.25rem 1.65rem;
        border-radius: 22px;
      }
      .actions {
        width: 100%;
      }
      .btn {
        flex: 1 1 auto;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body data-theme="aurora">
  <div class="aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <canvas id="constellation" aria-hidden="true"></canvas>

  <main class="stage">
    <section class="card" id="tilt-card">
      <div class="top-bar">
        <div class="status-pill">
          <span class="pulse-dot"></span>
          <span id="live-status">System Online</span>
        </div>

        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button class="theme-dot active" data-set="aurora" title="Cosmic Aurora" aria-label="Cosmic Aurora theme"></button>
          <button class="theme-dot" data-set="sunset" title="Solar Sunset" aria-label="Solar Sunset theme"></button>
          <button class="theme-dot" data-set="emerald" title="Cyber Emerald" aria-label="Cyber Emerald theme"></button>
          <button class="theme-dot" data-set="daylight" title="Crisp Daylight" aria-label="Crisp Daylight theme"></button>
        </div>
      </div>

      <span class="lang-tag" id="lang-label">English · Standard</span>
      <h1 id="greeting-text">Hello, World!</h1>

      <p class="subtitle">
        Every great project begins with a single greeting. Move your cursor to bend light and space, switch palettes above, or cycle greetings across the globe.
      </p>

      <div class="code-snippet" aria-label="Code example">
        <code>
          <span class="code-kw">console</span>.<span class="code-fn">log</span>(<span class="code-str" id="code-greeting">"Hello, World!"</span>);
        </code>
        <span style="opacity: 0.55; font-size: 0.76rem;">UTF-8</span>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="lang-btn" type="button">
          <span>🌐</span>
          <span>Translate Greeting</span>
        </button>
        <button class="btn btn-secondary" id="spark-btn" type="button">
          <span>✨</span>
          <span>Launch Sparkles</span>
        </button>
      </div>

      <div class="footer-meta">
        <span>Project 1 · Interactive HTML5 + Canvas</span>
        <span id="local-clock">--:--:--</span>
      </div>
    </section>
  </main>

  <script>
    // 1. Multilingual Greeting Cycler
    const greetings = [
      { lang: "English · Standard", text: "Hello, World!" },
      { lang: "Español · Spanish", text: "¡Hola, Mundo!" },
      { lang: "日本語 · Japanese", text: "こんにちは、世界！" },
      { lang: "Français · French", text: "Bonjour, le Monde !" },
      { lang: "हिन्दी · Hindi", text: "नमस्ते, दुनिया!" },
      { lang: "한국어 · Korean", text: "안녕하세요, 세계!" },
      { lang: "Italiano · Italian", text: "Ciao, Mondo!" },
      { lang: "Deutsch · German", text: "Hallo, Welt!" }
    ];

    let currentIdx = 0;
    const greetingEl = document.getElementById("greeting-text");
    const langLabelEl = document.getElementById("lang-label");
    const codeGreetingEl = document.getElementById("code-greeting");
    const langBtn = document.getElementById("lang-btn");

    langBtn.addEventListener("click", () => {
      currentIdx = (currentIdx + 1) % greetings.length;
      greetingEl.classList.add("fade-swap");
      langLabelEl.style.opacity = "0";

      setTimeout(() => {
        const item = greetings[currentIdx];
        greetingEl.textContent = item.text;
        langLabelEl.textContent = item.lang;
        codeGreetingEl.textContent = `"${item.text}"`;
        greetingEl.classList.remove("fade-swap");
        langLabelEl.style.opacity = "1";
      }, 200);
    });

    // 2. Theme Switcher
    const themeDots = document.querySelectorAll(".theme-dot");
    themeDots.forEach((dot) => {
      dot.addEventListener("click", () => {
        themeDots.forEach((d) => d.classList.remove("active"));
        dot.classList.add("active");
        document.body.setAttribute("data-theme", dot.dataset.set);
      });
    });

    // 3. Live Local Clock
    const clockEl = document.getElementById("local-clock");
    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 4. Subtle 3D Card Tilt & Cursor Spotlight
    const card = document.getElementById("tilt-card");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    window.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty("--mouse-x", `${x}px`);
      card.style.setProperty("--mouse-y", `${y}px`);

      if (prefersReducedMotion) return;

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
      const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);

      const rotateX = Math.max(-7, Math.min(7, -deltaY * 6));
      const rotateY = Math.max(-7, Math.min(7, deltaX * 6));
      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    window.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
    });

    // 5. Interactive Constellation & Sparkle Burst Canvas
    const canvas = document.getElementById("constellation");
    const ctx = canvas.getContext("2d");
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const sparkles = [];
    const PARTICLE_COUNT = Math.min(65, Math.floor((width * height) / 22000));

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        r: Math.random() * 1.8 + 0.8
      });
    }

    function spawnBurst(originX, originY) {
      const colors = ["#818cf8", "#f472b6", "#38bdf8", "#facc15", "#34d399"];
      for (let i = 0; i < 42; i++) {
        const angle = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.3;
        const speed = Math.random() * 5.5 + 2;
        sparkles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          life: 1,
          decay: Math.random() * 0.016 + 0.012,
          size: Math.random() * 3.5 + 1.5,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    document.getElementById("spark-btn").addEventListener("click", (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);
      const isDaylight = document.body.getAttribute("data-theme") === "daylight";
      const dotColor = isDaylight ? "rgba(79, 70, 229, 0.35)" : "rgba(255, 255, 255, 0.42)";

      // Ambient constellation
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = dotColor;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 130) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            const alpha = (1 - dist / 130) * (isDaylight ? 0.14 : 0.16);
            ctx.strokeStyle = isDaylight
              ? `rgba(79, 70, 229, ${alpha})`
              : `rgba(148, 163, 184, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      // Sparkle burst particles
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.09; // subtle gravity
        s.life -= s.decay;

        if (s.life <= 0) {
          sparkles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = s.life;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = s.color;
        ctx.fill();
        ctx.restore();
      }

      if (!prefersReducedMotion) {
        requestAnimationFrame(animate);
      }
    }

    animate();
  </script>
</body>
</html>
